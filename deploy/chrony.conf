# chrony for the tracker instance: Amazon Time Sync Service (link-local, on every EC2 instance).
# cloud-init appends "refclock PHC /dev/ptp0 poll 0 delay 0.000010 prefer" when the ENA PTP hardware clock exists.
server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4
driftfile /var/lib/chrony/drift
makestep 1.0 3
rtcsync
logdir /var/log/chrony
