[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ext-latency-tracker"
version = "0.1.0"
description = "Measures how late Extended (and Binance reference) market data reaches a co-located consumer"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "orjson>=3.10",
    "uvloop>=0.19; sys_platform == 'linux'",
    "zstandard>=0.22",
    "numpy>=1.26",
    "PyYAML>=6",
]

[project.optional-dependencies]
s3 = ["boto3"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["tracker", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end run against the local mock venue (~1 min each)"]
